# 应用编排：只跑应用容器，中间件由 docker-compose.yaml 单独维护。
# 目标主机运行时为 Podman + podman-compose（无 Docker），发布走 deploy-app.sh，它会先 source .env.infra。
# 所有凭据与端口一律由环境注入，本文件不提供任何可用默认值。
services:
  liteworkbench:
    image: ${LITEWORKBENCH_IMAGE:?未指定镜像，请执行 deploy-app.sh <镜像:tag>}
    container_name: liteworkbench
    restart: always
    # 加入中间件所在网络后，postgres / redis / manticore / minio / rabbitmq 主机名可直接解析
    networks:
      - infra
    # 2GB 小主机：容器限内存，JVM 的 MaxRAMPercentage 据此收敛堆上限
    mem_limit: 1152m
    environment:
      # rootless podman 的端口转发只识别 IPv4 监听，显式绑定 IPv4 通配地址
      SERVER_ADDRESS: 0.0.0.0
      LITEWORKBENCH_DATASOURCE_URL: jdbc:postgresql://postgres:5432/postgres
      LITEWORKBENCH_DATASOURCE_USERNAME: postgres
      LITEWORKBENCH_DATASOURCE_PASSWORD: ${LITEWORKBENCH_DATASOURCE_PASSWORD:?未设置数据库口令，请先执行 deploy/gen-secrets.sh}
      LITEWORKBENCH_REDIS_HOST: redis
      LITEWORKBENCH_REDIS_PASSWORD: ${LITEWORKBENCH_REDIS_PASSWORD:?未设置 Redis 口令，请先执行 deploy/gen-secrets.sh}
      # Manticore HTTP JSON API 只对同网络容器开放，走服务名直连，不发布宿主机端口
      LITEWORKBENCH_MANTICORE_URL: http://manticore:9308
      LITEWORKBENCH_STORAGE_ENDPOINT: http://minio:9000
      LITEWORKBENCH_STORAGE_ACCESS_KEY: ${LITEWORKBENCH_STORAGE_ACCESS_KEY:?未设置对象存储账号，请先执行 deploy/gen-secrets.sh}
      LITEWORKBENCH_STORAGE_SECRET_KEY: ${LITEWORKBENCH_STORAGE_SECRET_KEY:?未设置对象存储口令，请先执行 deploy/gen-secrets.sh}
      LITEWORKBENCH_MQ_HOST: rabbitmq
      LITEWORKBENCH_MQ_USERNAME: ${LITEWORKBENCH_MQ_USERNAME:?未设置消息队列账号，请先执行 deploy/gen-secrets.sh}
      LITEWORKBENCH_MQ_PASSWORD: ${LITEWORKBENCH_MQ_PASSWORD:?未设置消息队列口令，请先执行 deploy/gen-secrets.sh}
      LITEWORKBENCH_SECURITY_SECRET: ${LITEWORKBENCH_SECURITY_SECRET:?未设置签名密钥，请先执行 deploy/gen-secrets.sh}
      # 种子账号初始密码：留空则由应用随机生成并仅在启动日志 WARN 打印一次，账号首登强制改密
      LITEWORKBENCH_ADMIN_PASSWORD: ${LITEWORKBENCH_ADMIN_PASSWORD:-}
      LITEWORKBENCH_LOG_DIR: /var/log/liteworkbench
      LITEWORKBENCH_RUNTIME_DATA_DIR: /var/lib/liteworkbench
    ports:
      - "${LITEWORKBENCH_PORT:?未指定宿主端口，deploy-app.sh 会注入}:8080"
    volumes:
      - app_logs:/var/log/liteworkbench
      - app_data:/var/lib/liteworkbench

networks:
  # 中间件栈在宿主机的项目名为 liteworkbench（目录名），其默认网络即下方的默认值。
  # 不自己创建网络，只作为 guest 加入，避免动到中间件容器的网络归属。
  infra:
    external: true
    name: ${LITEWORKBENCH_NETWORK:-liteworkbench_default}

volumes:
  app_logs: { }
  app_data: { }
