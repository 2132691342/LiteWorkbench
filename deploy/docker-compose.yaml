# LiteWorkbench 中间件编排：PostgreSQL(pgvector) / Manticore / Redis / MinIO / RabbitMQ
# 镜像取自华为云 SWR，国内网络友好；端口与 docs/DEPLOYMENT.md 对齐
# 凭据一律由环境提供，仓库内不保留任何可用口令：先执行 ./gen-secrets.sh 生成 .env.infra
#
# 该文件部署到宿主机的应用目录（/opt/liteworkbench）后由 podman-compose 启动，
# 项目名取目录名，因此默认网络为 liteworkbench_default、卷名为 liteworkbench_<卷>；
# 应用编排按同一名字加入网络，改名会直接让应用连不上中间件。
#
# 端口绑定地址由 LITEWORKBENCH_BIND_ADDR 决定：缺省 0.0.0.0 便于本机开发工具直连，
# 服务器必须设 127.0.0.1 —— 中间件口令强度不足以承受公网直连，Manticore 更是无认证。
services:
  postgres:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/pgvector/pgvector:pg16
    container_name: pgvector
    restart: always
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${LITEWORKBENCH_DATASOURCE_PASSWORD:?未设置数据库口令，请先执行 deploy/gen-secrets.sh}
    ports:
      - "${LITEWORKBENCH_BIND_ADDR:-0.0.0.0}:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/library/redis:8
    container_name: redis
    restart: always
    # 口令经 shell 变量展开注入，避免把明文写进进程命令行（ps 可见）
    command: sh -c 'exec redis-server --requirepass "$$REDIS_PASSWORD" --maxmemory 256mb --maxmemory-policy allkeys-lru'
    environment:
      REDIS_PASSWORD: ${LITEWORKBENCH_REDIS_PASSWORD:?未设置 Redis 口令，请先执行 deploy/gen-secrets.sh}
    ports:
      - "${LITEWORKBENCH_BIND_ADDR:-0.0.0.0}:6379:6379"
    volumes:
      # 命名卷而非匿名卷：登录态与缓存要跨容器重建保留，匿名卷在 podman 重建时不会被复用
      - redis_data:/data
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG" ]
      interval: 10s
      timeout: 3s
      retries: 3

  manticore:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/manticoresearch/manticore:25.0.0
    container_name: manticore
    restart: always
    environment:
      EXTRA: ""
    ports:
      # 9306 MySQL 协议面向运维排障；9308 HTTP JSON API 供应用直连
      - "${LITEWORKBENCH_BIND_ADDR:-0.0.0.0}:9306:9306"
      - "${LITEWORKBENCH_BIND_ADDR:-0.0.0.0}:9308:9308"
    volumes:
      # 会话消息与知识库分块是用户数据，必须落命名卷；丢失后消息历史与检索能力同时消失
      - manticore_data:/var/lib/manticore
    ulimits:
      nofile:
        hard: 65536
        soft: 65535
    healthcheck:
      test: [ "CMD-SHELL", "mysql -h0 -P9306 -e 'SELECT 1'" ]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/pgsty/minio:RELEASE.2026-04-17T00-00-00Z
    container_name: minio
    restart: always
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${LITEWORKBENCH_STORAGE_ACCESS_KEY:?未设置对象存储账号，请先执行 deploy/gen-secrets.sh}
      MINIO_ROOT_PASSWORD: ${LITEWORKBENCH_STORAGE_SECRET_KEY:?未设置对象存储口令，请先执行 deploy/gen-secrets.sh}
    ports:
      - "${LITEWORKBENCH_BIND_ADDR:-0.0.0.0}:9000:9000"
      - "${LITEWORKBENCH_BIND_ADDR:-0.0.0.0}:9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 30s
      timeout: 20s
      retries: 3

  rabbitmq:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/rabbitmq:4-management
    container_name: rabbitmq
    restart: always
    environment:
      # 账号与口令同时必填：中间件用兜底值、应用侧必填，会出现「队列已起而应用连不上」的半启动状态
      RABBITMQ_DEFAULT_USER: ${LITEWORKBENCH_MQ_USERNAME:?未设置消息队列账号，请先执行 deploy/gen-secrets.sh}
      RABBITMQ_DEFAULT_PASS: ${LITEWORKBENCH_MQ_PASSWORD:?未设置消息队列口令，请先执行 deploy/gen-secrets.sh}
    ports:
      - "${LITEWORKBENCH_BIND_ADDR:-0.0.0.0}:5672:5672"
      - "${LITEWORKBENCH_BIND_ADDR:-0.0.0.0}:15672:15672"
    volumes:
      # 队列定义与未消费消息落命名卷，重建后不必依赖应用侧拓扑对账兜底
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "ping", "--quiet" ]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  pgdata: { }
  minio_data: { }
  manticore_data: { }
  redis_data: { }
  rabbitmq_data: { }
