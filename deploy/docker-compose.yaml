# LiteWorkbench 中间件编排：PostgreSQL(pgvector) / Manticore / Redis / MinIO / RabbitMQ
# 与云服务器（47.108.73.153，Podman）运行中的共享中间件栈保持一致，镜像取自华为云 SWR，国内网络友好
# 端口与凭据与 docs/DEPLOYMENT.md 对齐
services:
  postgres:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/pgvector/pgvector:pg16
    container_name: pgvector
    restart: always
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin_public
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/library/redis:8
    container_name: redis
    restart: always
    command: redis-server --requirepass admin_public --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "admin_public", "ping" ]
      interval: 10s
      timeout: 3s
      retries: 3

  manticore:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/manticoresearch/manticore:25.0.0
    container_name: manticore
    restart: always
    environment:
      EXTRA: ""
    ports:
      # 9306 MySQL 协议面向运维排障；9308 HTTP JSON API 只对同网络容器开放，不发布宿主机
      - "9306:9306"
    ulimits:
      nofile:
        hard: 65536
        soft: 65535
    healthcheck:
      test: [ "CMD-SHELL", "mysql -h0 -P9306 -e 'SELECT 1'" ]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/pgsty/minio:RELEASE.2026-04-17T00-00-00Z
    container_name: minio
    restart: always
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpublic
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 30s
      timeout: 20s
      retries: 3

  rabbitmq:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/rabbitmq:4-management
    container_name: rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin_public
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "ping", "--quiet" ]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  pgdata: { }
  minio_data: { }
