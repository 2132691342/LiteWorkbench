# LiteWorkbench 后端配置：默认值面向本地容器中间件，生产用环境变量覆盖
server:
  port: 8080
  # 显式绑定 IPv4 通配地址：rootless 容器端口转发只识别 IPv4 监听，IPv6 通配会导致宿主机端口不可达
  address: 0.0.0.0
  servlet:
    context-path: /

spring:
  application:
    name: lite-workbench
  autoconfigure:
    exclude:
      # 基础镜像的 JDK 是 17-ea，cgroup 探测返回 null 会让系统指标绑定器抛 NPE 直接炸掉启动：
      # SystemMetricsAutoConfiguration 读主机 CPU / 文件描述符，TomcatMetricsAutoConfiguration 在
      # 启动事件里读容器指标。单容器里这两类指标没有观测价值，平台健康与用量由 MonitorService 提供
      - org.springframework.boot.actuate.autoconfigure.metrics.SystemMetricsAutoConfiguration
      - org.springframework.boot.actuate.autoconfigure.metrics.web.tomcat.TomcatMetricsAutoConfiguration
  datasource:
    url: ${LITEWORKBENCH_DATASOURCE_URL:jdbc:postgresql://localhost:5432/postgres}
    username: ${LITEWORKBENCH_DATASOURCE_USERNAME:postgres}
    password: ${LITEWORKBENCH_DATASOURCE_PASSWORD:admin_public}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
  data:
    redis:
      host: ${LITEWORKBENCH_REDIS_HOST:localhost}
      port: ${LITEWORKBENCH_REDIS_PORT:6379}
      password: ${LITEWORKBENCH_REDIS_PASSWORD:admin_public}
      database: ${LITEWORKBENCH_REDIS_DATABASE:0}
      timeout: 3000ms
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
      # 必须显式指定：schema.sql 含中文种子数据（wb_tool 标签），不指定时按平台默认编码读取，Windows(GBK) 下整表标签变乱码
      encoding: UTF-8
      continue-on-error: false
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  jackson:
    default-property-inclusion: non_null
    time-zone: GMT+8
  rabbitmq:
    host: ${LITEWORKBENCH_MQ_HOST:localhost}
    port: ${LITEWORKBENCH_MQ_PORT:5672}
    username: ${LITEWORKBENCH_MQ_USERNAME:admin}
    password: ${LITEWORKBENCH_MQ_PASSWORD:admin_public}
    listener:
      simple:
        # 每个监听容器最少 2 个消费线程、峰值 4：日志投递与知识库解析的并发上界由此显式给出，不由线程池兜底
        concurrency: 2
        max-concurrency: 4
        # 预取条数：小容器下压住内存，同时保证消费端不空转
        prefetch: 8
        # multiplier 必须 > 1.0，否则 ExponentialBackOffPolicy 在启动期打告警且退避等同固定间隔
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1s
          max-interval: 10s
          multiplier: 2

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.liteworkbench.domain.entity
  # LocalDateTime ↔ timestamptz 全局映射，覆盖默认处理器
  type-handlers-package: com.liteworkbench.common
  configuration:
    map-underscore-to-camel-case: true
    default-fetch-size: 100
    default-statement-timeout: 30

# 认证鉴权：令牌风格用 ULID，登录态存 Redis
sa-token:
  # 令牌统一走 Authorization 头，值为令牌本身，不加 Bearer 前缀
  token-name: Authorization
  timeout: ${LITEWORKBENCH_AUTH_TOKEN_TIMEOUT:7200}
  active-timeout: -1
  is-concurrent: true
  is-share: false
  token-style: ulid
  is-log: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      # 探针免登录，不对外暴露组件细节
      show-details: never
      # 开启 liveness / readiness 分组，容器编排按 readiness 判断是否接流量
      probes:
        enabled: true


liteworkbench:
  # 日志目录，容器内用环境变量覆盖
  log-dir: ${LITEWORKBENCH_LOG_DIR:logs}
  auth:
    # 种子账号初始密码：生产用 LITEWORKBENCH_ADMIN_PASSWORD 注入，缺失则随机生成并仅打印一次
    admin-password: ${LITEWORKBENCH_ADMIN_PASSWORD:}
  agent:
    model:
      default-name: qwen-plus
      temperature: 0.3
      # 上下文窗口与输出预留，超出即压缩历史
      context-window: 32000
      reserve-tokens: 4096
      stream-timeout-seconds: 180
      sync-timeout-seconds: 120
      connect-timeout-seconds: 30
    loop:
      max-iters: 20
      # 同一工具同一参数重复调用护栏
      repeat-guard: 3
      tool-timeout-seconds: 60
    history:
      # 组装上下文时读取的历史消息条数上限
      limit: 40
    skill:
      enabled: true
  runtime:
    python:
      enabled: true
      # 空则按 数据目录 -> PATH 顺序探测
      path: ""
      timeout-seconds: 120
    # 运行时数据根目录，Python 工作目录挂在其下
    data-dir: ${LITEWORKBENCH_RUNTIME_DATA_DIR:./data}
  storage:
    endpoint: ${LITEWORKBENCH_STORAGE_ENDPOINT:http://localhost:9000}
    access-key: ${LITEWORKBENCH_STORAGE_ACCESS_KEY:minioadmin}
    secret-key: ${LITEWORKBENCH_STORAGE_SECRET_KEY:minioadminpublic}
    bucket-name: liteworkbench
  manticore:
    # HTTP JSON API；容器网络内为 http://manticore:9308（9308 不发布宿主机）
    url: ${LITEWORKBENCH_MANTICORE_URL:http://localhost:9308}
    # 日志表保留天数，每日定时任务清理
    log-retention-days: 30
  security:
    # 供应方密钥加密因子，生产必须覆盖
    secret: ${LITEWORKBENCH_SECURITY_SECRET:liteworkbench-default-secret}
  kb:
    chunk:
      # 单块目标字符数与相邻块重叠
      target-size: 600
      overlap: 120
  degradation:
    # 中间件不可用时是否允许降级启动
    allow-start: ${LITEWORKBENCH_DEGRADATION_ALLOW_START:true}

logging:
  config: classpath:logback-spring.xml
  level:
    root: info
    com.liteworkbench: info
