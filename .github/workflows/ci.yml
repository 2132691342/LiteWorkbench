name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: 后端构建与测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Maven 编译与测试
        working-directory: backend
        run: mvn -B -DskipTests=false package

  frontend:
    name: 前端构建与类型检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 安装依赖
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: 类型检查
        working-directory: frontend
        run: npm run typecheck
      - name: 构建
        working-directory: frontend
        run: npm run build

  release:
    name: 构建镜像并发布到云主机
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/liteworkbench:latest
            ghcr.io/${{ github.repository_owner }}/liteworkbench:${{ github.sha }}

      - name: 同步应用编排到云主机
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: deploy/docker-compose.app.yaml
          target: ${{ secrets.SSH_APP_DIR }}
          strip_components: 1

      - name: 到云主机拉起新镜像
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd ${{ secrets.SSH_APP_DIR }}
            export LITEWORKBENCH_IMAGE=ghcr.io/${{ github.repository_owner }}/liteworkbench:latest
            export LITEWORKBENCH_SECURITY_SECRET=${{ secrets.LITEWORKBENCH_SECURITY_SECRET }}
            # 目标主机运行时为 Podman + podman-compose，无 Docker
            podman-compose -f docker-compose.app.yaml pull
            podman-compose -f docker-compose.app.yaml up -d
            podman image prune -f
